<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Type</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Are you using a mobile phone or a PC?</h2>
        <button id="mobileBtn">Mobile Phone</button>
        <button id="pcBtn">PC</button>
    </div>

    <script>
        document.getElementById("mobileBtn").addEventListener("click", function() {
            window.location.href = "mobile.html"; // Redirect to mobile.html
        });

        document.getElementById("pcBtn").addEventListener("click", function() {
            window.location.href = "website.html"; // Redirect to website.html
        });
    </script>
</body>
</html>
